    .fancy-button:hover {

    }

    .fancy-button:last-child {

    }

  <h2>VX Reels Player</h2>
  <div class="row button-container">
    <button class="fancy-button" id="reels-lwp-true">true</button>
    <button class="fancy-button" id="reels-lwp-false">false</button>
  </div>

  <div id="kpoint-reels" style="--vx-primary-color: red"></div>

  <script src="https://showcase-qa.zencite.in/assets/orca/media/embed/player-vx.js"></script>

  <script>
    function initPlayer(lightWeightPlayer) {
      const container = document.querySelector("#kpoint-reels");
      const vxPlayer = VXPlayer(container, {
        hostname: "showcase-qa.zencite.in",
        type: "reels",
        videoIds: [
          "gcc-9c8393a9-f6c8-4d7f-98c0-03b8e60bfda7",
          "gcc-1d264a76-8fb7-4d63-bbe1-7646833029a0",
          "gcc-9c8393a9-f6c8-4d7f-98c0-03b8e60bfda7"
        ],
        fullscreen: true,
        autoScroll: true,
        mode: "popup",
        loop: true,
        comment: true,
        like: true,
        share: true,
        noOfVideosToPreload: 10,
        lightWeightPlayer: lightWeightPlayer
      });

      // vxPlayer.getVideoConfig = (videoId) => {
      //   return {
      //     packageId: "gcc-c7a9a",
      //   };
      // };
      // window.vxPlayer3 = vxPlayer;
    }

    function setupButtons() {
      document.getElementById("reels-lwp-true").addEventListener("click", () => initPlayer(true));
      document.getElementById("reels-lwp-false").addEventListener("click", () => initPlayer(false));
    }

    if (window.VXPlayer) {
      setupButtons();
    } else {
      document.addEventListener("vxplayerready", function () {
        setupButtons();
      });
    }

    document.addEventListener("kpw-onclick-button", function (event) {
      console.log(event.detail);
    });
  </script>
