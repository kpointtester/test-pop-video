<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kp-track embed harness v2</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --fg: #e4e7ec; --muted: #8b93a1; --ok: #5fd68a;
    --warn: #e8b04b; --link: #6fb6f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 16px; margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea {
    width: 100%; background: #101318; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; font: inherit; font-size: 12px;
  }
  textarea { resize: vertical; min-height: 74px; word-break: break-all; }
  button {
    background: var(--link); color: #0b1016; border: 0; border-radius: 4px;
    padding: 8px 14px; font: inherit; font-weight: 600; font-size: 12px;
    cursor: pointer; margin: 14px 8px 0 0;
  }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .params div { display: flex; gap: 10px; padding: 3px 0; font-size: 12px; }
  .params dt { color: var(--muted); min-width: 60px; }
  .params dd { margin: 0; word-break: break-all; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
  .tag.url { background: rgba(95,214,138,.15); color: var(--ok); }
  .tag.def { background: rgba(232,176,75,.15); color: var(--warn); }
  #genlink { display: block; margin-top: 12px; color: var(--link); font-size: 11px; word-break: break-all; }
  .note { color: var(--muted); font-size: 11px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  code { color: var(--warn); }
</style>
</head>
<body>

<h1>kp-track embed harness v2</h1>
<div class="sub">Markup is static and parser-inserted &mdash; attributes are patched before the embed script loads.</div>

<!-- ===================== EMBED: keep this block intact ===================== -->
<div id="kp-track-embed-wrapper" class="kp-track-embed-wrapper">
  <div id="kp-track-embed-container"
       data-ktrack-host="showcase-qa.zencite.in"
       data-ktrack-id="frestrac15324703"
       data-ktrack-kcid="cidd7725419b66461ab862fbd9cfc0621c"
       data-ktrack-token="3zlhw9IeV7tj1qmW3Foi2PK3zadj/cgg1nNZJjLAB/ouL0REgFEYkeDmcn2Ig3feywGwNzO87iKcuZUkQ0yWYZy3sT7+mLh2GAsDEV9DKwIQM7CsjQu5YXR8nHwwewB2q6CQLObB8Y13GOM9khZdgo8KGdTebp+ARb/6d/ixHvcsgOXfxVHDD7pGf57Jm44iUlRK6zkwk6BgN30hOEoRDVvbdVLAuSr8EEJ8QumTOyTW+5hds6ez5NtkaUGoxyOGAgzsjDqQC+yBWUVQvZiQuK1dRH3D3YaCsjlefqDn2+YRggrF0/zArSfucrzRkhR/iIfZquY2FAeGe0rFm3XW5zsyrNN7Kh5l4lGnZhcr9Xx1q4H7x7W0vse+aDyfY0LGHCTL6g23cXPCdKBS01z0HvGVHTJPfDiqKCpOg1y6m1rDYyhrtweVoyjGOgJRsQ0QPhBF9mIR2euL4mZWyt/">
  </div>

  <!-- patch attributes from the query string, then emit the embed script inline -->
  <script>
  (function () {
    var el = document.getElementById('kp-track-embed-container');
    var map = { host: 'data-ktrack-host', id: 'data-ktrack-id',
                kcid: 'data-ktrack-kcid', token: 'data-ktrack-token' };

    // manual parse so a literal "+" in the base64 token is not turned into a space
    var qs = {};
    window.location.search.slice(1).split('&').forEach(function (p) {
      if (!p) return;
      var i = p.indexOf('=');
      var k = i < 0 ? p : p.slice(0, i), v = i < 0 ? '' : p.slice(i + 1);
      try { qs[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { qs[k] = v; }
    });

    window.__kpHarness = { fromUrl: {}, active: {} };
    Object.keys(map).forEach(function (k) {
      var has = qs[k] !== undefined && qs[k] !== '';
      if (has) el.setAttribute(map[k], qs[k]);
      window.__kpHarness.fromUrl[k] = has;
      window.__kpHarness.active[k] = el.getAttribute(map[k]);
    });

    // document.write keeps this parser-inserted and synchronous, exactly like a
    // hardcoded <script src>. A dynamically appended script would be async and
    // could miss DOMContentLoaded, which breaks the embed's click handler.
    document.write('<scr' + 'ipt src="https://' + window.__kpHarness.active.host +
                   '/assets/orca/media/embed/kp-track-embed.js"><\/scr' + 'ipt>');
  })();
  </script>
</div>
<!-- =================== END EMBED: keep this block intact =================== -->

<div class="panel">
  <h2>Active parameters</h2>
  <dl class="params" id="active"></dl>
</div>

<div class="panel">
  <h2>Build a link</h2>
  <label for="f-host">host</label>
  <input id="f-host">
  <label for="f-id">ktrack-id</label>
  <input id="f-id">
  <label for="f-kcid">ktrack-kcid</label>
  <input id="f-kcid">
  <label for="f-token">ktrack-token (paste raw, encoding handled)</label>
  <textarea id="f-token"></textarea>
  <button id="go">Load this embed</button>
  <button id="copy" class="ghost">Copy link</button>
  <a id="genlink" href="#"></a>
  <div class="note">
    The token is base64 and contains <code>+</code> and <code>/</code>. A raw <code>+</code> in a URL decodes to a space and auth fails &mdash; this builder percent-encodes it for you.
  </div>
</div>

<script>
(function () {
  var H = window.__kpHarness;
  var keys = ['host', 'id', 'kcid', 'token'];

  var dl = document.getElementById('active');
  keys.forEach(function (k) {
    var v = H.active[k] || '';
    var shown = (k === 'token' && v.length > 60)
      ? v.slice(0, 40) + '\u2026' + v.slice(-12) + '  (' + v.length + ' chars)' : v;
    var row = document.createElement('div');
    row.innerHTML = '<dt>' + k + '</dt><dd>' + shown +
      '<span class="tag ' + (H.fromUrl[k] ? 'url">from URL' : 'def">default') + '</span></dd>';
    dl.appendChild(row);
  });

  var f = {};
  keys.forEach(function (k) { f[k] = document.getElementById('f-' + k); f[k].value = H.active[k] || ''; });

  function buildUrl() {
    var base = window.location.origin + window.location.pathname;
    return base + '?' + keys.map(function (k) {
      return k + '=' + encodeURIComponent(f[k].value.trim());
    }).join('&');
  }

  var link = document.getElementById('genlink');
  function refresh() { var u = buildUrl(); link.href = u; link.textContent = u; }
  keys.forEach(function (k) { f[k].addEventListener('input', refresh); });
  refresh();

  document.getElementById('go').addEventListener('click', function () { window.location.href = buildUrl(); });
  document.getElementById('copy').addEventListener('click', function (e) {
    navigator.clipboard.writeText(buildUrl()).then(function () {
      e.target.textContent = 'Copied';
      setTimeout(function () { e.target.textContent = 'Copy link'; }, 1500);
    });
  });
})();
</script>

</body>
</html>
